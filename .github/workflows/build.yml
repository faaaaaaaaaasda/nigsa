name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show what is being built
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          git log -1 --oneline
          wc -l src/main/java/com/wincors/smp/AdminCommand.java
          echo "--- line 490 ---"
          sed -n '490p' src/main/java/com/wincors/smp/AdminCommand.java

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: WincorsSMP
          path: target/*.jar
          if-no-files-found: error
