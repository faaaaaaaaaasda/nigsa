# =====================================================================
#  Wincors SMP - ORIGINS & LEGENDARY WEAPONS  (edit, then /wincors reload)
# =====================================================================
#  The ten origin KEYS (PYRO, AQUA, ...) are fixed. Everything inside them
#  can be changed: display name, color, description, GUI icon, and the
#  legendary weapon given at max mana.
#
#  weapon.proc = what happens when the weapon hits (needs max mana + the
#  matching origin). Keys: cooldown-seconds, extra-damage, fire-ticks,
#  freeze-ticks, knockback (push away), launch (throw upward), lightning,
#  heal-attacker (health points), particle, effects ("EFFECT:seconds:amp").
#  weapon.enchants use "ENCHANT:level" (levels above vanilla max are allowed).
# =====================================================================

PYRO:
  display: Pyro
  color: '&c'
  description: Masters of flame. Burn everything in your path.
  icon: BLAZE_POWDER
  weapon:
    name: Emberfang
    material: NETHERITE_SWORD
    unbreakable: true
    enchants:
    - SHARPNESS:5
    - SWEEPING_EDGE:3
    - FIRE_ASPECT:2
    - UNBREAKING:3
    proc:
      cooldown-seconds: 6
      extra-damage: 3
      fire-ticks: 160
      freeze-ticks: 0
      knockback: 0.0
      launch: 0.0
      lightning: false
      heal-attacker: 0
